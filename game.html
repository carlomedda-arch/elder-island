<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acchiappa la Stella</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#10152b;color:#fff;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(92vw,700px)}canvas{width:100%;border:3px solid #fff;border-radius:14px;background:#182044;cursor:crosshair}.stats{display:flex;justify-content:space-around;font-size:20px}button{margin:12px;padding:10px 18px;border:0;border-radius:9px;font-size:16px}</style></head><body><main><h1>⭐ Acchiappa la Stella</h1><p>Clicca la stella prima che scada il tempo!</p><div class="stats"><span>Punti: <b id="score">0</b></span><span>Tempo: <b id="time">30</b>s</span></div><canvas id="game" width="700" height="420"></canvas><br><button id="start">Inizia / Ricomincia</button><p id="msg">Premi Inizia per giocare.</p></main><script>const c=document.querySelector('#game'),x=c.getContext('2d');let score=0,time=30,star={x:350,y:210,r:25},timer,running=false;function place(){star.x=35+Math.random()*(c.width-70);star.y=35+Math.random()*(c.height-70)}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#20295a';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ffd84d';x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?star.r*.45:star.r;x.lineTo(star.x+Math.cos(a)*r,star.y+Math.sin(a)*r)}x.closePath();x.fill()}function update(){scoreEl.textContent=score;timeEl.textContent=time}const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');function end(){running=false;clearInterval(timer);document.querySelector('#msg').textContent=`Fine! Hai fatto ${score} punti.`}c.onclick=e=>{if(!running)return;let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;if(Math.hypot(mx-star.x,my-star.y)<=star.r){score++;place();draw();update()}};document.querySelector('#start').onclick=()=>{score=0;time=30;running=true;place();update();document.querySelector('#msg').textContent='Vai!';draw();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)};draw();</script></body></html>
